apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: lb-configuration
  namespace: lab01
spec:
  scheme: internet-facing

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: lab01
spec:
  gatewayClassName: lab01-cluster-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: lb-configuration
  listeners:
  - name: http
    protocol: HTTP
    port: 80
