apiVersion: v1
kind: Pod
metadata:
  name: besteffort
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30

---

apiVersion: v1
kind: Pod
metadata:
  name: burstable
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"  

---

apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"  
      requests:
        cpu: "100m"
        memory: "64Mi"  

---

apiVersion: v1
kind: Pod
metadata:
  name: limit-only
  namespace: lab01
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"  
