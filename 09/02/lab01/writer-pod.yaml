apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: lab01
  labels:
    app: writer
spec:
  terminationGracePeriodSeconds: 5
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c", "date +%T | tee -a /write/start.log; sleep 3600 & wait"]
    volumeMounts:
    - name: shared
      mountPath: /write

  volumes:
  - name: shared
    persistentVolumeClaim:
      claimName: shared