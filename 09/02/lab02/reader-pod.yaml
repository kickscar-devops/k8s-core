apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: lab02
  labels:
    app: reader
spec:
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: worker2
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 3600 & wait"]
    volumeMounts:
    - name: shared
      mountPath: /read

  volumes:
  - name: shared
    persistentVolumeClaim:
      claimName: shared