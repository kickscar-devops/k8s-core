apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: lab02
spec:
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c", "date +%T | tee -a /write/start.log; sleep 3600 & wait"]
    volumeMounts:
    - name: shared
      mountPath: /write

  volumes:
  - name: shared
    hostPath:
      path: /tmp/k8s-core/09/01/lab02
      type: DirectoryOrCreate

---

apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: lab02
spec:
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sleep", "3600"]
    volumeMounts:
    - name: shared
      mountPath: /read

  volumes:
  - name: shared
    hostPath:
      path: /tmp/k8s-core/09/01/lab02
      type: DirectoryOrCreate
