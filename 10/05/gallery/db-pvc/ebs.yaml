apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: gallery
spec:
  storageClassName: ebs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
