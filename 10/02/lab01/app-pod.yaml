apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: lab01
  labels:
    tier: app
spec:  
  containers:

# 개별 환경 변수 방식 (valueFrom)
  - name: busybox1
    image: busybox:1.37
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 3600 & wait"]
    env:
    - name: MODE
      valueFrom:
        configMapKeyRef:
          name: app
          key: APP_MODE
    - name: VERSION
      valueFrom:
        configMapKeyRef:
          name: app
          key: APP_VERSION
  
# 전체 환경 변수 방식 (envFrom)
  - name: busybox2
    image: busybox:1.37
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 3600 & wait"]
    envFrom:
    - configMapRef:
        name: app

# Volume Mount 방식
  - name: busybox3
    image: busybox:1.37
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 3600 & wait"]
    volumeMounts:
    - name: config
      mountPath: /etc/config

# Volume Mount Subpath 방식
  - name: busybox4
    image: busybox:1.37
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep 3600 & wait"]
    volumeMounts:
    - name: config
      mountPath: /etc/config
    - name: config
      mountPath: /etc/app/mode
      subPath: APP_MODE
    - name: config
      mountPath: /etc/app/version
      subPath: APP_VERSION

  volumes:
  - name: config
    configMap:
      name: app