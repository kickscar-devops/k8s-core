apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab03-web
  namespace: lab03
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  selector:
    matchLabels:
      app: web
  
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.30
        ports:
        - containerPort: 80
        command: ["sh", "-c", "sleep 10; exec nginx -g 'daemon off;'"]

        lifecycle:
          preStop:
            sleep:
              seconds: 5
     
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
